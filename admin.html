<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - B2B Wholesale Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header></header>
  <main>
    <div id="adminBlocked" style="display:none;" class="card">
      <h2 style="color:#dc2626;">⛔ Accès refusé</h2>
      <p>Cette page est réservée aux administrateurs. <a href="compte.html" style="color:var(--primary);">Se connecter</a></p>
    </div>
    <div id="adminContent" style="display:none;">
      <h1 class="section-title">Administration des produits</h1>
      <section class="card" style="margin-bottom:1rem;">
        <h2 style="font-size:1.1rem;margin-bottom:0.75rem;">Ajouter / modifier un produit</h2>
        <div id="messageAdmin"></div>
        <form id="formProduit">
          <input type="hidden" id="produitId">
          <div class="form-group"><label>Titre *</label><input type="text" id="titreProduit" required></div>
          <div class="form-group"><label>Description *</label><textarea id="descriptionProduit" rows="2" required></textarea></div>
          <div class="form-group"><label>Prix unitaire (€) *</label><input type="number" step="0.01" id="prixProduit" required></div>
          <div class="form-group"><label>Quantité minimale *</label><input type="number" id="quantiteMinProduit" required></div>
          <div class="form-group"><label>Catégorie</label><input type="text" id="categorieProduit" placeholder="Ex : Textile"></div>
          <div class="form-group"><label>URL image</label><input type="text" id="imageProduit" placeholder="https://..."></div>
          <button type="submit" class="btn-primary">Enregistrer</button>
          <button type="button" class="btn-outline" onclick="resetForm()" style="margin-left:0.5rem;">Annuler</button>
        </form>
      </section>
      <section class="card">
        <h2 style="font-size:1.1rem;margin-bottom:0.75rem;">Liste des produits</h2>
        <div id="listeProduitsAdmin"><p>Chargement...</p></div>
      </section>
    </div>
  </main>
  <footer></footer>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/admin.js"></script>
  <script>renderHeader('admin'); renderFooter();</script>
</body>
</html>
