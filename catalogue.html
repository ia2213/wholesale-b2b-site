<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Catalogue - B2B Wholesale Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header></header>
  <main>
    <h1 class="section-title">Catalogue produits</h1>
    <section class="card" style="margin-bottom:1rem;">
      <form id="filtreForm" style="display:flex;gap:0.75rem;flex-wrap:wrap;">
        <div style="flex:1 1 180px;"><label for="categorie">Catégorie</label>
          <select id="categorie"><option value="">Toutes</option><option value="Textile">Textile</option><option value="Emballage">Emballage</option><option value="Fournitures">Fournitures</option></select>
        </div>
        <div style="flex:1 1 180px;"><label for="minQuantite">Quantité minimale</label><input type="number" id="minQuantite" min="0" placeholder="Ex : 50"></div>
        <div style="align-self:flex-end;"><button type="submit" class="btn-primary">Filtrer</button></div>
      </form>
    </section>
    <section id="listeProduits" class="product-grid"><p>Chargement des produits...</p></section>
  </main>
  <footer></footer>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/catalogue.js"></script>
  <script>renderHeader('catalogue'); renderFooter();</script>
</body>
</html>
