<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon compte — WholesaleHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header></header>
<main>

  <div id="zoneAuth">
    <div style="max-width:440px;margin:0 auto;">
      <div class="tab-list" id="authTabs">
        <button class="tab-btn active" onclick="switchTab('connexion')">Connexion</button>
        <button class="tab-btn" onclick="switchTab('inscription')">Créer un compte</button>
      </div>
      <div id="tab-connexion" class="auth-card">
        <h2 class="auth-title">Connexion</h2>
        <p class="auth-subtitle">Accédez à votre espace professionnel.</p>
        <form id="formConnexion">
          <div class="form-group">
            <label for="emailCo">Email professionnel</label>
            <input type="email" id="emailCo" placeholder="email@societe.fr" required>
          </div>
          <div class="form-group">
            <label for="mdpCo">Mot de passe</label>
            <input type="password" id="mdpCo" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Se connecter</button>
        </form>
        <p style="margin-top:1rem;font-size:0.8125rem;color:var(--text-muted);text-align:center;">Pas encore de compte ? <a href="#" onclick="switchTab('inscription')" style="color:var(--accent);font-weight:600;">S'inscrire</a></p>
        <div id="msgConnexion"></div>
      </div>
      <div id="tab-inscription" class="auth-card" style="display:none;">
        <h2 class="auth-title">Créer un compte</h2>
        <p class="auth-subtitle">Rejoignez la plateforme B2B gratuitement.</p>
        <form id="formInscription">
          <div class="form-group">
            <label for="societe">Nom de société</label>
            <input type="text" id="societe" placeholder="Ma Société SAS" required>
          </div>
          <div class="form-group">
            <label for="emailIns">Email professionnel</label>
            <input type="email" id="emailIns" placeholder="email@societe.fr" required>
          </div>
          <div class="form-group">
            <label for="mdpIns">Mot de passe</label>
            <input type="password" id="mdpIns" placeholder="8 caractères minimum" required minlength="8">
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Créer mon compte</button>
        </form>
        <p style="margin-top:1rem;font-size:0.8125rem;color:var(--text-muted);text-align:center;">Déjà un compte ? <a href="#" onclick="switchTab('connexion')" style="color:var(--accent);font-weight:600;">Se connecter</a></p>
        <div id="msgInscription"></div>
      </div>
    </div>
  </div>

  <div id="zoneCompte" style="display:none;">
    <div class="tab-list" id="compteTabs">
      <button class="tab-btn active" onclick="switchCompteTab('profil', this)">Profil</button>
      <button class="tab-btn" onclick="switchCompteTab('commandes', this)">Mes commandes</button>
      <button class="tab-btn" onclick="switchCompteTab('panier', this)">Panier</button>
    </div>
    <div id="compte-profil" class="compte-tab" style="display:block;"><div class="card"><p style="color:var(--text-muted);">Chargement du profil...</p></div></div>
    <div id="compte-commandes" class="compte-tab"><div class="card"><p style="color:var(--text-muted);">Chargement des commandes...</p></div></div>
    <div id="compte-panier" class="compte-tab"><div class="card"><p style="color:var(--text-muted);">Chargement du panier...</p></div></div>
  </div>

</main>
<footer></footer>
<script>
function switchTab(tab) {
  document.getElementById('tab-connexion').style.display = tab === 'connexion' ? 'block' : 'none';
  document.getElementById('tab-inscription').style.display = tab === 'inscription' ? 'block' : 'none';
  document.querySelectorAll('#authTabs .tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && tab === 'connexion') || (i === 1 && tab === 'inscription'));
  });
}
function switchCompteTab(tab, btn) {
  document.querySelectorAll('.compte-tab').forEach(el => el.style.display = 'none');
  document.getElementById('compte-' + tab).style.display = 'block';
  document.querySelectorAll('#compteTabs .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
if (location.hash === '#inscription') switchTab('inscription');
</script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/compte.js"></script>
<script>renderHeader('compte'); renderFooter();</script>
</body>
</html>
