<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon compte - B2B Wholesale Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header></header>
  <main>
    <h1 class="section-title">Mon espace</h1>
    <div style="margin-bottom:1rem;flex-wrap:wrap;display:flex;">
      <button class="tab-btn" data-tab="connexion">Se connecter</button>
      <button class="tab-btn" data-tab="inscription">Créer un compte</button>
      <button class="tab-btn" data-tab="panier">🛒 Panier</button>
      <button class="tab-btn" data-tab="commandes">📦 Mes commandes</button>
    </div>
    <div class="compte-tab" id="tab-connexion">
      <div class="card" style="max-width:420px;">
        <h2 style="font-size:1.1rem;margin-bottom:1rem;color:var(--primary-dark);">Connexion</h2>
        <div id="msgLogin"></div>
        <div class="form-group"><label>E-mail</label><input type="email" id="loginEmail" placeholder="vous@exemple.com"></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="loginMdp" placeholder="••••••••"></div>
        <button id="btnLogin" class="btn-primary" style="width:100%;padding:0.65rem;">Se connecter</button>
      </div>
    </div>
    <div class="compte-tab" id="tab-inscription">
      <div class="card" style="max-width:420px;">
        <h2 style="font-size:1.1rem;margin-bottom:1rem;color:var(--primary-dark);">Créer un compte professionnel</h2>
        <div id="msgReg"></div>
        <div class="form-group"><label>Société</label><input type="text" id="regSociete" placeholder="Ma Société SAS"></div>
        <div class="form-group"><label>E-mail professionnel</label><input type="email" id="regEmail" placeholder="vous@societe.com"></div>
        <div class="form-group"><label>Mot de passe (min. 6 caractères)</label><input type="password" id="regMdp" placeholder="••••••••"></div>
        <button id="btnReg" class="btn-primary" style="width:100%;padding:0.65rem;">Créer mon compte</button>
      </div>
    </div>
    <div class="compte-tab" id="tab-panier">
      <div class="card" style="margin-bottom:1rem;">
        <h2 style="font-size:1rem;margin-bottom:0.75rem;color:var(--primary-dark);">Informations de livraison</h2>
        <div class="form-group"><label>Société</label><input type="text" id="societe"></div>
        <div class="form-group"><label>Adresse de livraison</label><textarea id="adresse" rows="2"></textarea></div>
      </div>
      <div class="card" style="margin-bottom:1rem;">
        <h2 style="font-size:1rem;margin-bottom:0.75rem;color:var(--primary-dark);">Panier</h2>
        <div id="panierContainer"></div>
      </div>
      <div class="card">
        <button id="btnValiderCommande" class="btn-primary" style="padding:0.65rem 1.5rem;">Valider la commande</button>
        <div id="messageCommande" style="margin-top:0.75rem;"></div>
      </div>
    </div>
    <div class="compte-tab" id="tab-commandes">
      <h2 class="section-title">Mes commandes</h2>
      <div id="commandesContainer"><p>Chargement...</p></div>
    </div>
  </main>
  <footer></footer>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/compte.js"></script>
  <script>renderHeader('compte'); renderFooter();</script>
</body>
</html>
